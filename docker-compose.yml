# MORPHEUS — full stack for local/demo. Phase 1 uses db + backend + frontend;
# neo4j is included now so the graph (Phase 3) has a home and health can probe it.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: morpheus
      POSTGRES_PASSWORD: morpheus
      POSTGRES_DB: morpheus
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morpheus"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/morpheus-neo4j
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4jdata:/data

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://morpheus:morpheus@db:5432/morpheus
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: morpheus-neo4j
      SECRET_KEY: change-me-in-production
      CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8010"
    ports: ["8010:8010"]
    volumes:
      - storage:/app/storage

  frontend:
    build: ./frontend
    depends_on: [backend]
    environment:
      VITE_API_URL: http://localhost:8010
    ports: ["5174:5174"]

volumes:
  pgdata:
  neo4jdata:
  storage:
